name: Deploy Dev

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build-deploy:
    name: Test, Build, Deploy (Dev)
    runs-on: ubuntu-latest
    environment: dev
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit + integration tests (Vitest)
        run: npm run test:run

      - name: Show Supabase project ref
        run: |
          node -e "const raw=process.env.VITE_SUPABASE_URL || ''; const host=raw.replace(/^https?:\/\//, '').split('/')[0]; const ref=host.split('.')[0]; if (!ref) { console.error('VITE_SUPABASE_URL is missing or invalid'); process.exit(1); } console.log('Supabase project ref used for dev build:', ref);"

      - name: Build app
        run: npm run build

      - name: Verify built Supabase host
        run: |
          node -e "const fs=require('fs'); const raw=process.env.VITE_SUPABASE_URL || ''; const host=raw.replace(/^https?:\/\//, '').split('/')[0]; const files=fs.readdirSync('dist/assets').filter((file)=>file.endsWith('.js')); const contents=files.map((file)=>fs.readFileSync('dist/assets/'+file,'utf8')).join('\n'); if (!contents.includes(host)) { console.error('Built bundle does not contain expected Supabase host:', host); process.exit(1); } console.log('Built bundle contains Supabase host:', host);"

      - name: Prepare Vercel static output
        run: |
          node -e "const fs=require('fs'); fs.rmSync('.vercel/output',{recursive:true,force:true}); fs.mkdirSync('.vercel/output/static',{recursive:true}); fs.cpSync('dist','.vercel/output/static',{recursive:true}); fs.writeFileSync('.vercel/output/config.json', JSON.stringify({version:3,routes:[{handle:'filesystem'},{src:'/.*',dest:'/index.html'}]}, null, 2));"

      - name: Deploy to Vercel (Preview)
        run: npx vercel@latest deploy --prebuilt --token="${VERCEL_TOKEN}" --yes
